[project]
name = "ObjectNat"
# kept in sync with rust/Cargo.toml, objectnat/_version.py and CITATION.cff by python-semantic-release
version = "2.1.0"
description = "ObjectNat is an open-source library for object-level geospatial analysis on city networks, developed by the IDU team."
readme = "README.rst"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "DDonnyy", email = "63115678+DDonnyy@users.noreply.github.com" },
]
keywords = [
    "urban analytics",
    "geospatial",
    "GIS",
    "accessibility",
    "isochrones",
    "service provision",
    "visibility analysis",
    "isovist",
    "noise simulation",
    "street network",
    "GeoPandas",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = [
    "geopandas>=1.1.0,<2.0.0",
    "iduedu>=2.2.0,<3.0.0",
    "loguru>=0.7.3,<0.8.0",
    "numpy>=2.0.0,<3.0.0; python_version < '3.14'",
    "numpy>=2.4.0,<3.0.0; python_version >= '3.14'",
    "pandas>=2.2.0,<4.0.0; python_version < '3.14'",
    "pandas>=3.0.0,<4.0.0; python_version >= '3.14'",
    "scipy>=1.16.0,<2.0.0; python_version < '3.14'",
    "scipy>=1.17.0,<2.0.0; python_version >= '3.14'",
    "tqdm>=4.66.2,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/IDUclub/ObjectNat"
Documentation = "https://iduclub.github.io/ObjectNat/"
Repository = "https://github.com/IDUclub/ObjectNat"
Issues = "https://github.com/IDUclub/ObjectNat/issues"
Changelog = "https://github.com/IDUclub/ObjectNat/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "notebooks" },
    { include-group = "release" },
    { include-group = "test" },
    { include-group = "viz" },
    "pre-commit>=4.2.0,<5.0.0",
]
docs = [
    "furo>=2025.9.25,<2026.0.0",
    "linkify-it-py>=2.0.3,<3.0.0",
    "myst-nb>=1.1.0,<2.0.0",
    "myst-parser>=4.0.1,<5.0.0",
    "sphinx>=8.0.0,<9.0.0",
    "sphinx-autodoc-typehints>=3.2.0,<4.0.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinx-design>=0.6.0,<0.7.0",
]
lint = [
    "black>=25.9.0,<26.0.0",
    "isort>=6.1.0,<7.0.0",
    "pylint>=3.3.5,<4.0.0",
]
notebooks = [
    "jupyter>=1.1.1,<2.0.0",
]
release = [
    "python-semantic-release>=9.15.0,<10.0.0",
]
test = [
    "matplotlib>=3.8.0,<4.0.0; python_version < '3.14'",
    "matplotlib>=3.10.7,<4.0.0; python_version >= '3.14'",
    "pyarrow>=18.1.0,<26.0.0; python_version < '3.14'",
    "pyarrow>=22.0.0,<26.0.0; python_version >= '3.14'",
    "pytest>=8.3.5,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
]
viz = [
    "folium>=0.19.5,<0.20.0",
    "mapclassify>=2.8.1,<3.0.0",
    "matplotlib>=3.8.0,<4.0.0; python_version < '3.14'",
    "matplotlib>=3.10.7,<4.0.0; python_version >= '3.14'",
]


[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

# The package is pure Python plus one compiled extension, objectnat._rust, built from rust/ (PyO3, abi3:
# one wheel per platform covers every supported Python version).
[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/Cargo.toml"
module-name = "objectnat._rust"
python-source = "."
python-packages = ["objectnat"]
features = ["pyo3/extension-module"]
exclude = [
    { path = "objectnat/**/__pycache__/**", format = "sdist" },
    { path = "objectnat/_rust*.so", format = "sdist" },
    { path = "objectnat/_rust*.pyd", format = "sdist" },
]

[tool.uv]
# rebuild the extension when the Rust sources change, not only when pyproject.toml does
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/src/**/*.rs" }]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pylint.format]
max-line-length = 120
expected-line-ending-format = "LF"
max-locals = 20
disable = [
    "duplicate-code",
    "fixme",
    "missing-module-docstring",
    "missing-function-docstring",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-arguments",
    "cyclic-import",
    "line-too-long",
    "too-many-return-statements",
    "too-many-positional-arguments",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
split_on_trailing_comma = true
skip = ["__init__.py"]

[tool.coverage.run]
branch = true
source = ["objectnat"]
relative_files = true

[tool.coverage.report]
# Floor set below the ~85% baseline (2026-07-10) so runs stay green despite
# accessibility coverage drifting with live Overpass graph data.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "pragma: no branch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires a live Overpass request to build an OSM graph"]

# ---------------------------------------------------------------------------
# Automated releases (python-semantic-release)
#
# The next version is derived from Conventional Commit messages since the last
# tag: feat -> minor, fix/perf -> patch, feat!/BREAKING CHANGE -> major.
# In the official repository, the release workflow runs after Tests and Coverage
# succeeds on master, bumps the version in pyproject.toml, rust/Cargo.toml,
# objectnat/_version.py and CITATION.cff, refreshes uv.lock, updates CHANGELOG.md,
# commits, tags vX.Y.Z, builds the sdist and the abi3 wheels, and publishes.
# See CONTRIBUTING.md.
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version", "rust/Cargo.toml:package.version"]
version_variables = ["objectnat/_version.py:VERSION", "CITATION.cff:version"]
assets = ["uv.lock"]
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]\n\nAutomated release, see CHANGELOG.md."
build_command = "python -m pip install uv 'maturin>=1.9,<2.0' && uv lock && maturin sdist --out dist"
allow_zero_version = false
major_on_zero = true

[tool.semantic_release.branches.master]
match = "master"

[tool.semantic_release.commit_parser_options]
# Conventional-commit types that trigger a version bump. Everything else
# (docs, test, chore, refactor, ci, style, build) leaves the version untouched.
allowed_tags = [
    "feat",
    "fix",
    "perf",
    "build",
    "chore",
    "ci",
    "docs",
    "refactor",
    "style",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ['''^chore\(release\):.*''']
