[package]
name = "objectnat-rs"
# kept in sync with pyproject.toml by python-semantic-release; never bump by hand
version = "2.2.0"
edition = "2021"
rust-version = "1.82"
license = "BSD-3-Clause"
description = "Rust core of the ObjectNat Python package"
repository = "https://github.com/IDUclub/ObjectNat"
readme = "README.md"
publish = false

[lib]
name = "objectnat_rust"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
rayon = "1.10"

[profile.release]
codegen-units = 1
lto = "fat"
