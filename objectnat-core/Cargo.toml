[package]
name = "objectnat-core"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Native (Rust) computational core for ObjectNat"
repository = "https://github.com/IDUclub/ObjectNat"
readme = "README.md"
publish = false

[lib]
name = "objectnat_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
rayon = "1.10"

[profile.release]
codegen-units = 1
lto = "fat"
