name: Tests and Coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: make install-dev

      - name: Check formatting
        run: make format-check

      - name: Run pylint
        run: make lint

  test:
    runs-on: ubuntu-latest
    permissions:
      # Pull requests from forks get these downgraded to read-only by GitHub; their
      # comment is posted by coverage.yml instead.
      contents: write # push coverage data and the badge to python-coverage-comment-action-data
      pull-requests: write # post or update the coverage comment on pull requests from this repository

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: make install-dev

      - name: Run tests with coverage
        run: make coverage-xml

      # The coverage report, the badge and the rendered images come from one
      # interpreter only, so they are not published twice.
      - name: Upload coverage report artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Coverage comment and badge
        id: coverage_comment
        if: matrix.python-version == '3.11'
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

      - name: Store the pull request comment for coverage.yml
        if: matrix.python-version == '3.11' && steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

      # The test suite renders result plots into tests/test_output/, which the README
      # and docs hotlink from the assets branch.
      - name: Upload rendered test images
        if: matrix.python-version == '3.11' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: test-images
          path: tests/test_output/*.png
          if-no-files-found: error

  publish-assets:
    needs: test
    if: >
      github.repository == 'IDUclub/ObjectNat' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-push the rendered test images to the assets branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download rendered test images
        uses: actions/download-artifact@v4
        with:
          name: test-images
          path: ${{ runner.temp }}/test-images

      # The branch holds one commit with the current images, so binary history does
      # not pile up and the hotlinked URLs stay the same.
      - name: Replace the assets branch with the new images
        env:
          IMAGES_DIR: ${{ runner.temp }}/test-images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan assets-update
          git rm -rf --quiet .
          cp "$IMAGES_DIR"/*.png .
          git add ./*.png
          git commit --quiet -m "Update test images from ${GITHUB_SHA::7}"
          git push --force origin HEAD:assets
