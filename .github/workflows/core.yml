name: Native core

# Builds and tests the optional Rust core (objectnat-core) and runs the ObjectNat
# suite on top of it. Wheels are built and uploaded as artifacts only; nothing is published.

on:
  push:
    branches: [master]
    paths:
      - "objectnat-core/**"
      - "objectnat/methods/visibility/**"
      - "objectnat/methods/noise/**"
      - "tests/test_visibility*.py"
      - "tests/test_noise*.py"
      - ".github/workflows/core.yml"
  pull_request:
    branches: [master]
    paths:
      - "objectnat-core/**"
      - "objectnat/methods/visibility/**"
      - "objectnat/methods/noise/**"
      - "tests/test_visibility*.py"
      - "tests/test_noise*.py"
      - ".github/workflows/core.yml"

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt, clippy, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: objectnat-core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --release

  python:
    name: ObjectNat tests with the core (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install runtime and test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Build and install the core
        run: uv pip install ./objectnat-core

      - name: Check the core is importable
        run: uv run --no-sync python -c "import objectnat_core; print(objectnat_core.__version__)"

      - name: Run offline tests
        run: uv run --no-sync python -m pytest -q -m "not network"

  wheels:
    name: Wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: objectnat-core
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: objectnat-core-${{ matrix.os }}-${{ matrix.target }}
          path: objectnat-core/dist/*.whl
